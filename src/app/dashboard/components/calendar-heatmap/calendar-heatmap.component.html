<div #shareArea id="share-area" class="calendar-card p-3 rounded-4 shadow-sm bg-white position-relative">
  
@if (isExporting()) {
    <div class="share-only-header mb-3 border-bottom pb-2">
      <div class="d-flex align-items-center gap-2">
        <div class="user-avatar-mini bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; font-size: 0.8rem;">
          {{ userKey().substring(0, 2).toUpperCase() }}
        </div>
        <div>
          <h5 class="m-0 fw-bold" style="color: #334155; font-size: 0.9rem;"> 
            {{ 'CALENDAR.PROGRESS_OF' | translate:{ name: userKey() } }}
          </h5>
          <small class="text-muted" style="font-size: 0.7rem;">Kinetic Training</small>
        </div>
      </div>
    </div>
  }

  <h6 class="fw-bold mb-3 text-secondary" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">
    {{ 'CALENDAR.WEEKLY_ACTIVITY' | translate }}</h6>
  
   
  <div class="d-flex flex-column flex-md-row align-items-center gap-4 heatmap-main-row">
    <div class="d-flex justify-content-between flex-grow-1 gap-1 weekly-days-row">
    @for (day of weeklyActivity(); track $index) {
      <div class="d-flex flex-column align-items-center gap-2">
        <div class="day-cell-container">
          <div class="day-box workout-box" 
              [title]="('CALENDAR.WORKOUT' | translate) + ': ' + (day.workout.completed ? ('CALENDAR.COMPLETED' | translate) : ('CALENDAR.PENDING' | translate))"
               [class]="'workout-intensity-' + day.workout.intensity"
               [class.completed]="day.workout.completed"
               (click)="toggleDayActivity($index, 'workout')"
               style="cursor: pointer;">
          </div>
          <div class="day-box nutrition-box" 
          [title]="('CALENDAR.NUTRITION' | translate) + ': ' + (day.nutrition.completed ? ('CALENDAR.GOAL_REACHED' | translate) : ('CALENDAR.PENDING' | translate))"
               [class]="'nutrition-intensity-' + day.nutrition.intensity"
               [class.completed]="day.nutrition.completed"
               (click)="toggleDayActivity($index, 'nutrition')"
               style="cursor: pointer;">
          </div>
        </div>

        <span class="text-muted fw-bold day-label"
        [class.is-today]="$index === todayIndex()"
        style="font-size: 0.65rem;">
        {{ day.label }}
       </span>
      </div>
    }
  </div>

    <div class="rings-summary-wrapper">
      <p class="motivation-message mb-2">{{ motivationMessage() }}</p>
      <div class="rings-summary-container" [class.glow-pulse]="isAllProgressComplete()">
      <svg viewBox="0 0 36 36" class="circular-chart">
        <defs>
          <linearGradient id="workoutRingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5eead4"/>
            <stop offset="55%" stop-color="#2dd4bf"/>
            <stop offset="100%" stop-color="#0f766e"/>
          </linearGradient>
          <linearGradient id="nutritionRingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdba74"/>
            <stop offset="55%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#c2410c"/>
          </linearGradient>
        </defs>
        <path class="circle-bg" pathLength="100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
        <path class="circle workout-ring" pathLength="100"
              stroke="url(#workoutRingGradient)"
              [style.stroke-dasharray]="totalWorkoutProgress() + ', 100'"
              d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
        
        <path class="circle-bg inner" pathLength="100" d="M18 7.5 a 10.5 10.5 0 0 1 0 21 a 10.5 10.5 0 0 1 0 -21"/>
        <path class="circle nutrition-ring" pathLength="100"
              stroke="url(#nutritionRingGradient)"
              [style.stroke-dasharray]="totalNutritionProgress() + ', 100'"
              d="M18 7.5 a 10.5 10.5 0 0 1 0 21 a 10.5 10.5 0 0 1 0 -21"/>
      </svg>
      </div>
    </div>

  </div>
